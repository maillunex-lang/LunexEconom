<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#081b18">
  <title>Админка · LunexEconom</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LUNEXECONOM · УПРАВЛЕНИЕ</p>
        <h1>Панель администратора</h1>
      </div>
      <div class="actions"><button id="open-password-change" class="button ghost hidden" type="button">Сменить пароль</button><button id="logout" class="button ghost hidden" type="button">Выйти</button></div>
    </header>

    <section id="login" class="card login-card" aria-labelledby="login-title">
      <h2 id="login-title">Вход</h2>
      <p class="muted">Используйте аккаунт с ролью администратора.</p>
      <form id="login-form" class="form">
        <label>Логин или почта
          <input name="username" autocomplete="username" required>
        </label>
        <label>Пароль
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="button primary" type="submit">Войти</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="app" class="hidden" aria-live="polite">
      <section id="password-change" class="card login-card hidden" aria-labelledby="password-change-title">
        <h2 id="password-change-title">Сменить пароль</h2>
        <p id="password-change-hint" class="muted"></p>
        <form id="password-change-form" class="form">
          <label>Новый пароль (не менее 14 символов)<input name="password" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label>
          <label>Повторите пароль<input name="confirmation" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label>
          <div class="actions"><button class="button primary" type="submit">Сохранить пароль</button><button id="password-change-cancel" class="button ghost" type="button">Отмена</button></div>
          <p id="password-change-error" class="error" role="alert"></p>
        </form>
      </section>
      <nav id="admin-tabs" class="tabs" aria-label="Разделы панели">
        <button class="tab active" data-tab="overview" type="button">Обзор</button>
        <button class="tab" data-tab="players" type="button">Игроки</button>
        <button class="tab" data-tab="economy" type="button">Экономика</button>
        <button class="tab" data-tab="cities" type="button">Города</button>
        <button class="tab" data-tab="events" type="button">События</button>
        <button class="tab" data-tab="server" type="button">Сервер и тики</button>
        <button class="tab" data-tab="alerts" type="button">Алерты <span id="alerts-count"></span></button>
        <button class="tab" data-tab="settings" type="button">Настройки</button>
        <button class="tab" data-tab="catalog" type="button">Каталог</button>
        <button class="tab" data-tab="announcements" type="button">Объявления</button>
        <button class="tab" data-tab="releases" type="button">Релизы и версии</button>
        <button class="tab" data-tab="audit" type="button">Аудит</button>
      </nav>
      <div id="content"></div>
    </section>
  </main>
  <script src="./config.js"></script>
  <script src="./a3.js"></script>
  <script src="./help.js"></script>
  <script src="./app.js"></script>
</body>
</html>
