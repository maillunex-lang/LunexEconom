# Вставить внутрь существующего server { } для rikagro.ru (HTTPS уже настроен).
limit_req_zone $binary_remote_addr zone=createportal_login:10m rate=10r/m;

location = /createportal { return 301 /createportal/; }
location /createportal/api/login {
    limit_req zone=createportal_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:18790;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
}
location = /createportal/hook/github {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:18790;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}
location /createportal/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:18790;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}
