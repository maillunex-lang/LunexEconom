.mini .mt{font-weight:600;font-size:14px;line-height:1.3}
.tag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.idea{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:60}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

  var h=el('div','row spread');var l=el('div');l.appendChild(el('div','muted small','Линия '+p.lane+' · '+(d.lanes[p.lane]?d.lanes[p.lane].name+' · '+d.lanes[p.lane].who:'')+' · шаг '+p.step));
  var t=el('h2');t.appendChild(el('span','pid',p.id));t.appendChild(document.createTextNode(p.title));l.appendChild(t);h.appendChild(l);h.appendChild(btn('Закрыть','ghost',function(){openId=null;drawBoard()},{tip:'Закрыть панель задачи'}));c.appendChild(h);
  c.appendChild(pill((s==='planned'&&r)?'ready':s,(s==='planned'&&r)?LABEL.ready:LABEL[s]));
  c.appendChild(el('p','',p.goal));
  if(p.depends_on.length)c.appendChild(el('div','small muted','Зависит от: '+p.depends_on.join(', ')));
  var cr=el('div');cr.appendChild(el('b','small','Критерии готовности'));var ul=el('ul');ul.style.cssText='margin:6px 0;padding-left:20px;font-size:14px';(p.done_when||[]).forEach(function(x){ul.appendChild(el('li','',x))});cr.appendChild(ul);c.appendChild(cr);
  var det=el('details');det.open=true;det.appendChild(el('summary','','Промпт для исполнителя'));det.appendChild(el('pre','',p.prompt));det.appendChild(btn('Скопировать промпт','primary',function(){copy(p.prompt)},{icon:'copy',tip:'Скопировать весь текст задания, чтобы передать исполнителю'}));c.appendChild(det);
  c.appendChild(el('b','small','Действия'));c.appendChild(actionRow(p,s,r));
  var si=d.state[p.id];if(si){var m=[];if(si.issued_at)m.push('выдано '+fmt(si.issued_at));if(si.submitted_at)m.push('сдано '+fmt(si.submitted_at));if(si.accepted_at)m.push('принято '+fmt(si.accepted_at));if(m.length)c.appendChild(el('div','muted small',m.join(' · ')));if(si.merged)c.appendChild(el('div','muted small','Влито в main'+(si.sha?' ('+si.sha+')':'')+(si.note?' · '+si.note:'')))}
  ov.appendChild(c);app.appendChild(ov);
}
function showImport(){
  drawBar('Загрузка плана');app.textContent='';var hd=el('div');hd.appendChild(el('h1','','Загрузка плана'));hd.appendChild(el('div','muted','Вставьте содержимое файла docs/work_plan.json из репозитория проекта. Портал проверит его и покажет ошибки, если они есть.'));app.appendChild(hd);
  var c=el('div','card');var ta=el('textarea');ta.rows=14;ta.placeholder='{"rules": ..., "lanes": ..., "packages": [...]}';ta.setAttribute('aria-label','JSON плана');var e=el('div','err small');
  c.appendChild(ta);var row=el('div','row');row.appendChild(btn('Загрузить','primary',function(){var plan;try{plan=JSON.parse(ta.value)}catch(x){e.textContent='Это не JSON.';return}
    api('/api/projects/'+current.slug+'/plan','POST',{plan:plan}).then(function(){toast('План загружен');showBoard(current.slug)}).catch(function(x){e.textContent=x.data&&x.data.details?x.data.details.join('; '):'План не принят.'})},{icon:'upload',tip:'Проверить и сохранить план'}));row.appendChild(btn('Назад','',function(){showBoard(current.slug)}));c.appendChild(row);c.appendChild(e);app.appendChild(c);
}
function showProtocol(){
  drawBar('Протокол для ИИ');app.textContent='';var hd=el('div');hd.appendChild(el('h1','','Протокол для ИИ'));hd.appendChild(el('div','muted','Как ИИ-директор добавляет этапы и промпты в портал. Этот текст попадает в каждый новый проект.'));app.appendChild(hd);
  api('/api/protocol').then(function(r){var c=el('div','card');var row=el('div','row');row.appendChild(btn('Скопировать протокол','primary',function(){copy(r.markdown)},{icon:'copy'}));row.appendChild(btn('Назад','',function(){current?showBoard(current.slug):showProjects()}));c.appendChild(row);c.appendChild(el('pre','',r.markdown));app.appendChild(c)});
}
function showHelp(){
  var ov=el('div','ov');ov.onclick=function(e){if(e.target===ov)ov.remove()};var c=el('div','drawer');c.setAttribute('role','dialog');c.setAttribute('aria-label','Справка');
  var h=el('div','row spread');h.appendChild(el('h2','','Справка'));h.appendChild(btn('Закрыть','ghost',function(){ov.remove()}));c.appendChild(h);
  c.appendChild(el('b','','Как это работает'));
  var ol=el('ol');ol.style.cssText='margin:6px 0;padding-left:20px';['Создайте проект и отдайте ИИ-директору два стартовых промпта: он организует репозиторий и разработает GDD.','Директор составит план работ. Нажмите «Синхронизировать», и задачи появятся на доске.','Откройте задачу, скопируйте промпт, передайте исполнителю и нажмите «Отдал исполнителю».','Когда исполнитель сдал, нажмите «Исполнитель сдал». Директор проверит и сольёт работу.','Когда директор подтвердит, нажмите «Принято, в архив». Откроется следующая задача.'].forEach(function(x){ol.appendChild(el('li','',x))});c.appendChild(ol);
  c.appendChild(el('b','','Статусы задач'));
  [['planned','В очереди','Ждёт, пока будут приняты предыдущие шаги. Выдать нельзя.'],['ready','Можно выдавать','Все предыдущие шаги приняты. Можно брать промпт и отдавать исполнителю.'],['issued','У исполнителя','Вы отдали задачу, исполнитель работает.'],['submitted','Ждёт приёмки','Исполнитель сдал. Директор проверяет и сливает в main.'],['accepted','Принято','Проверено и влито в main. Лежит в архиве.']].forEach(function(x){var r=el('div','act');r.appendChild(pill(x[0],x[1]));r.appendChild(el('div','help',x[2]));c.appendChild(r)});
  c.appendChild(el('b','','Кнопки'));
  [['Схема / По шагам','Переключает вид доски: колонки или порядок шагов.'],['Синхронизировать','Берёт свежий план из репозитория GitHub (нужен токен только на чтение).'],['Загрузить план','Ручная вставка work_plan.json, если синхронизация не настроена.'],['Протокол для ИИ','Инструкция директору, как вести план.'],['Скопировать промпт','Копирует текст задания для передачи исполнителю.'],['Отдал исполнителю','Фиксирует, что задание передано.'],['Исполнитель сдал','Фиксирует, что пришёл отчёт.'],['Принято, в архив','Нажмите дважды после подтверждения директора.'],['Учтено','Убирает идею из входящих.']].forEach(function(x){var r=el('div','act');r.appendChild(el('b','small',x[0]));r.appendChild(el('div','help',x[1]));c.appendChild(r)});
  ov.appendChild(c);document.body.appendChild(ov);
}
api('/api/me').then(function(m){ME=m.user;CSRF=m.csrf;showProjects()}).catch(function(){showLogin()});
})();
