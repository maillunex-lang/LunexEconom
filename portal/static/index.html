<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CreatePortal</title>
<meta name="theme-color" content="#DDE8DF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08130F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Портал">
<link rel="manifest" href="__BASE__/manifest.webmanifest">
<link rel="icon" href="__BASE__/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="__BASE__/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Liquid glass: полупрозрачные поверхности, размытие фона, блики по краю */
:root{--bg:#DDE8DF;--ink:#0F1C16;--muted:#4A5E54;--line:rgba(255,255,255,.55);--edge:rgba(255,255,255,.75);--hair:rgba(15,28,22,.12);
--glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.34);--glass-strong:rgba(255,255,255,.72);
--accent:#1F7A4D;--accent2:#15603C;--accent-ink:#fff;--warn:#8A5A00;--warn-bg:rgba(255,200,80,.38);--info:#1B55A0;--info-bg:rgba(90,150,235,.30);--ok:#17613D;--ok-bg:rgba(70,200,130,.32);--lock:#6B7C73;--err:#B3261E;
--blob1:#7BE0A6;--blob2:#7FB6FF;--blob3:#FFD58A;--laneA:#1F7A4D;--laneB:#1B55A0;--laneC:#8A5A00;
--shadow:0 10px 36px rgba(20,50,35,.16),0 2px 6px rgba(20,50,35,.08);--blur:blur(24px) saturate(1.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08130F;--ink:#EAF4EE;--muted:#A3B9AC;--line:rgba(255,255,255,.14);--edge:rgba(255,255,255,.28);--hair:rgba(255,255,255,.12);
--glass:rgba(24,52,40,.46);--glass2:rgba(24,52,40,.30);--glass-strong:rgba(22,46,36,.72);--accent:#6FD08A;--accent2:#8FE3A6;--accent-ink:#06130D;--warn:#F2C76B;--warn-bg:rgba(240,190,70,.22);--info:#9CC4F7;--info-bg:rgba(110,160,240,.22);--ok:#86DE9C;--ok-bg:rgba(90,210,140,.22);--lock:#86998F;--err:#F2B8B5;
--blob1:#1F6B47;--blob2:#1F4E8C;--blob3:#6B4A12;--laneA:#6FD08A;--laneB:#9CC4F7;--laneC:#F2C76B;--shadow:0 12px 40px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08130F;--ink:#EAF4EE;--muted:#A3B9AC;--line:rgba(255,255,255,.14);--edge:rgba(255,255,255,.28);--hair:rgba(255,255,255,.12);
--glass:rgba(24,52,40,.46);--glass2:rgba(24,52,40,.30);--glass-strong:rgba(22,46,36,.72);--accent:#6FD08A;--accent2:#8FE3A6;--accent-ink:#06130D;--warn:#F2C76B;--warn-bg:rgba(240,190,70,.22);--info:#9CC4F7;--info-bg:rgba(110,160,240,.22);--ok:#86DE9C;--ok-bg:rgba(90,210,140,.22);--lock:#86998F;--err:#F2B8B5;
--blob1:#1F6B47;--blob2:#1F4E8C;--blob3:#6B4A12;--laneA:#6FD08A;--laneB:#9CC4F7;--laneC:#F2C76B;--shadow:0 12px 40px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;padding:0 0 64px;min-height:100vh;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.85}
.bg i:nth-child(1){width:520px;height:520px;left:-120px;top:-100px;background:var(--blob1)}
.bg i:nth-child(2){width:600px;height:600px;right:-160px;top:120px;background:var(--blob2);opacity:.6}
.bg i:nth-child(3){width:460px;height:460px;left:30%;bottom:-180px;background:var(--blob3);opacity:.55}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.12}h2{font-size:18px}h3{font-size:16px;line-height:1.3}
.muted{color:var(--muted)}.small{font-size:13px}.err{color:var(--err)}
/* стекло */
.glass,.card,.tile,.col,.node,.drawer,.bar-in,.now-card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),var(--shadow);position:relative}
.card::before,.tile::before,.now-card::before,.node::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,0) 38%);mix-blend-mode:soft-light}
@supports not (backdrop-filter:blur(1px)){.glass,.card,.tile,.col,.node,.drawer,.bar-in,.now-card{background:var(--glass-strong)}}
.bar{position:sticky;top:0;z-index:20;padding:10px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px))}
.bar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between;border-radius:22px;padding:6px 12px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:17px;cursor:pointer;border:0;background:none;color:var(--ink);padding:4px;min-height:44px;box-shadow:none;backdrop-filter:none}
.brand svg{width:26px;height:26px;color:var(--accent)}
.crumb{color:var(--muted);font-weight:500;font-size:14px;display:flex;gap:6px;align-items:center;min-width:0}
.crumb b{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}
main{max-width:1280px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.card{border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.spread{justify-content:space-between}
button,input,textarea,.lnk{font:inherit}
button,.lnk{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--edge);background:var(--glass2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);cursor:pointer;text-decoration:none;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 8px rgba(20,50,35,.08);transition:transform .12s,background .12s}
button svg,.lnk svg{width:18px;height:18px;flex:none}
button:hover{background:var(--glass-strong)}button:active{transform:scale(.97)}
button.primary,.lnk.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:var(--accent-ink);border-color:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
button.primary:hover{background:linear-gradient(180deg,var(--accent),var(--accent2))}
button.ghost{background:transparent;color:var(--muted);border-color:transparent;box-shadow:none;backdrop-filter:none}
button.ghost:hover{background:var(--glass2);border-color:var(--edge)}
button.confirm{background:var(--warn);color:#fff;border-color:rgba(255,255,255,.5)}
button.icon{padding:8px;min-width:44px;justify-content:center}
button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:50;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:min(280px,70vw);background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;line-height:1.4;padding:8px 10px;border-radius:12px;white-space:normal;text-align:left;pointer-events:none;box-shadow:var(--shadow)}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden;background:var(--glass2);backdrop-filter:blur(12px);padding:3px;gap:2px}
.seg button{border:0;border-radius:999px;min-height:38px;background:transparent;box-shadow:none;backdrop-filter:none}
.seg button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:var(--accent-ink)}
input,textarea{width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--edge);background:var(--glass-strong);color:var(--ink)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.help{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:"Space Grotesk",system-ui,sans-serif;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile svg{position:absolute;right:14px;top:14px;width:20px;height:20px;color:var(--muted)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media(max-width:560px){.hero{grid-template-columns:1fr}}
.ring{width:96px;height:96px;position:relative}.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",system-ui,sans-serif;font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;align-self:flex-start;border:1px solid var(--edge)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.planned{background:var(--glass2);color:var(--lock)}.pill.ready,.pill.accepted{background:var(--ok-bg);color:var(--ok)}.pill.issued{background:var(--warn-bg);color:var(--warn)}.pill.submitted{background:var(--info-bg);color:var(--info)}
.pid{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;color:var(--accent);margin-right:6px}
.tag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--glass2);border:1px solid var(--edge);color:var(--muted)}
/* «Сейчас» */
.nows{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.now-card{border-radius:26px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.now-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--lane)}
.now-card h2{font-size:21px;line-height:1.25}
/* дорожки */
.lanes{overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity;scroll-padding-left:132px}
.lgrid{display:grid;gap:10px;align-items:stretch;min-width:max-content}
.lh{position:sticky;left:0;z-index:2;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;font-weight:700;border-radius:18px;background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.lh i{width:8px;height:44px;border-radius:6px;background:var(--lane)}
.sh{text-align:center;font-weight:600;font-size:12px;color:var(--muted);line-height:1.25}.sh small{display:block;font-weight:400;font-size:11px}
.node{border-radius:20px;padding:10px 11px 12px;min-height:104px;min-width:126px;display:flex;flex-direction:column;gap:3px;cursor:pointer;scroll-snap-align:start;transition:transform .14s}
.node:hover{transform:translateY(-2px)}
.node b{font:700 15px "Space Grotesk",system-ui,sans-serif;color:var(--lane)}
.node .t{font-size:12px;line-height:1.3}
.node .ic{position:absolute;right:11px;top:9px;font-weight:700;font-size:14px}
.node.accepted{background:var(--ok-bg)}.node.issued{background:var(--warn-bg)}.node.submitted{background:var(--info-bg)}
.node.ready{border:2px solid var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent),var(--shadow)}
.node.queue{background:var(--glass2);border-style:dashed;opacity:.88}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px}
.idea{border-top:1px solid var(--hair);padding-top:8px;display:flex;flex-direction:column;gap:4px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--glass2);border:1px solid var(--edge);border-radius:16px;padding:12px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:340px;overflow:auto;margin:8px 0}
details{border-top:1px solid var(--hair);padding-top:8px}summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
.ov{position:fixed;inset:0;background:rgba(6,16,11,.38);backdrop-filter:blur(6px);display:flex;justify-content:flex-end;align-items:stretch;z-index:40}
.drawer{max-width:100vw;min-width:0;width:min(600px,100%);height:100%;overflow:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:14px;border-radius:28px 0 0 28px;background:var(--glass-strong)}
@media(max-width:700px){.ov{align-items:flex-end}.drawer{height:90%;border-radius:28px 28px 0 0;width:100%}}
.act{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--hair)}.act:first-child{border-top:0}.act .help{flex:1;min-width:0}
.log{display:flex;flex-direction:column;gap:6px}.log div{display:flex;gap:10px;font-size:13.5px}.log time{color:var(--muted);flex:none;font-variant-numeric:tabular-nums;min-width:118px}
.notice{background:var(--warn-bg);border:1px solid var(--edge);border-radius:18px;padding:10px 14px;font-size:14px}
.empty{text-align:center;padding:30px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}.empty svg{width:72px;height:72px;color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);z-index:60}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:780px){.pair{grid-template-columns:minmax(0,1fr)}}
.stp{display:flex;flex-direction:column;gap:10px}
.master{border-color:var(--accent)}
.mini{border-radius:20px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--glass);backdrop-filter:var(--blur);border:1px solid var(--edge);box-shadow:var(--shadow)}
.mini .mt{font-weight:600;font-size:14px;line-height:1.3}.mini.locked{opacity:.8}
@media(max-width:560px){.bar button span{display:none}.brand span{display:none}.crumb b{max-width:34vw}.bar-in{gap:4px}}

/* B3: отчёт, приёмка и обзор */
.b3-review{min-width:0;max-width:100%;box-sizing:border-box;overflow-wrap:anywhere;border:1px solid var(--edge);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;margin:14px 0;background:var(--glass2)}
.b3-review textarea{width:100%;min-height:112px;box-sizing:border-box}
.b3-check{display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer}
.b3-check input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.b3-overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}
.b3-overview .card{min-width:0}
.b3-attention{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--hair);padding:9px 0}
.b3-metrics{display:flex;flex-wrap:wrap;gap:14px}
.b3-metric{flex:1;min-width:110px}
.b3-bars{display:flex;align-items:end;gap:8px;height:90px;margin-top:10px}
.b3-bars div{flex:1;min-width:12px;max-width:45px;background:var(--accent);border-radius:5px 5px 0 0}
@media(max-width:720px){.b3-overview{grid-template-columns:minmax(0,1fr)}}
/* B2: настройки и проверка PR/CI */
.b2-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.b2-grid .wide{grid-column:1/-1}
.b2-field{min-width:0;display:flex;flex-direction:column;gap:7px}
.b2-field input{min-height:48px}
.b2-switch{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink)}
.b2-switch input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.b2-switch input:disabled{opacity:.55}
.b2-pr{border:1px solid var(--edge);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--glass2);overflow-wrap:anywhere}
.b2-pr a{color:var(--accent2);overflow-wrap:anywhere}
.b2-audit-row{padding:10px 0;border-top:1px solid var(--hair);display:flex;gap:12px;flex-wrap:wrap}
.b2-audit-row time{min-width:140px;color:var(--muted)}
.b2-state{font-size:13px;color:var(--muted)}
@media(max-width:720px){.b2-grid{grid-template-columns:minmax(0,1fr)}.b2-grid .wide{grid-column:1}.b2-audit-row{flex-direction:column;gap:3px}}
/* B1: мобильная лесенка по макету v4 */
.phone-board{display:none}
.phone-switch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:999px;padding:4px}
.phone-switch button{min-width:0;min-height:46px;justify-content:center;padding:8px 3px;font-size:12.5px;white-space:nowrap}
.phone-switch button.on{background:var(--accent);color:var(--accent-ink)}
.phone-parallel{display:flex;align-items:center;gap:8px;border-radius:20px;padding:8px 10px;min-width:0}
.phone-parallel .parallel-copy{min-width:0;flex:1;font-size:12.5px;overflow-wrap:anywhere}
.phone-parallel button{min-height:44px;padding:8px 10px;font-size:12px;color:var(--laneB)}
.phone-lane-title{font-size:12px;color:var(--muted);padding:2px 4px}
.phone-step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;min-width:0}
.phone-rail{position:relative;display:flex;justify-content:center}
.phone-rail:before{content:'';position:absolute;top:0;bottom:-12px;left:14px;width:3px;background:var(--hair)}
.phone-step:last-child .phone-rail:before{bottom:50%}
.phone-dot{position:relative;z-index:1;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--glass-strong);font-size:12px;font-weight:700}
.phone-step.done .phone-dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.phone-step.active .phone-dot{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.phone-step.future{opacity:.64}
.phone-step-content{min-width:0;min-height:39px;padding-bottom:10px}
.phone-step-summary{display:flex;gap:5px;align-items:baseline;flex-wrap:wrap;padding:4px 0;font-size:13px}
.phone-step-summary .pid{margin:0;font-size:14px}
.phone-step-summary .small{color:var(--muted)}
.phone-step-card{padding:12px;border-radius:22px;gap:8px}
.phone-step-card .row{align-items:stretch}
.phone-step-card button{flex:1;justify-content:center;min-width:0;padding:8px}
.phone-bottom-actions{position:fixed;z-index:25;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:12px;right:12px;max-width:440px;margin:auto;display:flex;gap:8px;padding:8px;border:1px solid var(--edge);border-radius:22px;background:var(--glass-strong);backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.phone-bottom-actions button{flex:1;min-width:0;justify-content:center;padding:8px;font-size:12px;min-height:48px}
.phone-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.phone-pair .phone-step{grid-template-columns:22px minmax(0,1fr);gap:5px}
.phone-pair .phone-rail:before{left:10px}
.phone-pair .phone-dot{width:22px;height:22px;font-size:10px}
.phone-pair .phone-step-summary{font-size:11px}
.phone-pair .phone-step-card{padding:9px;gap:7px}
.phone-pair .phone-step-card .row{flex-direction:column}
.phone-pair .phone-step-card button{font-size:11px;min-height:44px}
.phone-pair .pill{font-size:10px;white-space:normal}
@media(max-width:720px){
 .phone-board{display:flex;flex-direction:column;gap:12px;min-width:0}
 .desktop-board,.desktop-board-summary,.board-heading .toolbar{display:none!important}
 .phone-board>*{min-width:0}

function taskMeta(p){var d=current&&current.d;if(!d)return {};var state=d.state&&d.state[p.id]||{};return {pr:p.pr||state.pr,ci:p.ci||state.ci,merged:!!(state.merged||(p.pr&&p.pr.merged)||(state.pr&&state.pr.merged)),sha:state.sha||p.sha}}
function ciSuccess(ci){if(!ci)return false;var v=typeof ci==='string'?ci:(ci.state||ci.status||ci.conclusion||'');return /^(success|successful|passed|green|ok)$/i.test(v)}

function safePR(url){try{var u=new URL(url);return u.protocol==='https:'&&u.hostname==='github.com'&&/^\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\/pull\/\d+\/?$/.test(u.pathname)?u.href:null}catch(e){return null}}

  var sha=m.sha||pr.sha;if(sha)card.appendChild(el('div','small','SHA: '+String(sha)));

  var ci=m.ci;if(ci){var overall=typeof ci==='string'?ci:(ci.state||ci.status||ci.conclusion||'');if(s==='submitted'&&/^(pending|queued|waiting|in_progress|running)$/i.test(overall))card.appendChild(pill('submitted','Ждём CI'));else card.appendChild(el('div','small','CI: '+(overall||'статус не указан')));

}
