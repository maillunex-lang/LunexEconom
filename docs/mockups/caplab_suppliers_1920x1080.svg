<text x="1204" y="500" font-family="sans-serif" font-size="16" fill="#EEF5E8" text-anchor="start">52</text>
<rect x="1660" y="464" width="180" height="56" rx="12" fill="#22483B" stroke="#2E5A4B" stroke-width="2"/>
<text x="1750" y="498" font-family="sans-serif" font-size="16" fill="#EEF5E8" text-anchor="middle">Выбрать</text>
<text x="64" y="600" font-family="sans-serif" font-size="16" fill="#EEF5E8" text-anchor="start">Слоты поставщиков на вход «Бутылка»: 1 — Стеклозавод №2 (доля 60 %), 2 — Рынок Уфы (доля 40 %), 3 — не выбран</text>
<text x="64" y="640" font-family="sans-serif" font-size="14" fill="#A1B9AD" text-anchor="start">Покупатель платит доставку и топливо. Оценка = цена + качество + надёжность + расстояние. Дороже внешнего порта не покупаем.</text>
<rect x="64" y="700" width="300" height="56" rx="12" fill="#B7EFA5"/>
<text x="214" y="734" font-family="sans-serif" font-size="16" fill="#0A201B" text-anchor="middle">Массовая смена поставщика</text>
<rect x="384" y="700" width="300" height="56" rx="12" fill="#22483B" stroke="#2E5A4B" stroke-width="2"/>
<text x="534" y="734" font-family="sans-serif" font-size="16" fill="#EEF5E8" text-anchor="middle">Показать на карте</text>
<rect x="40" y="830" width="1840" height="120" rx="18" fill="#173A30"/>
<text x="64" y="880" font-family="sans-serif" font-size="15" fill="#A1B9AD" text-anchor="start">Подсказка: у Стеклозавода №2 надёжность 96 %. Если он не довезёт, недобор возьмёт Рынок Уфы по приоритету.</text>
