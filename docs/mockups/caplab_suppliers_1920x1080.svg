<text x="824" y="420" font-family="sans-serif" font-size="16" fill="#EEF5E8" text-anchor="start">88 %</text>
<text x="1044" y="420" font-family="sans-serif" font-size="16" fill="#EEF5E8" text-anchor="start">41 км</text>
<text x="1204" y="420" font-family="sans-serif" font-size="16" fill="#EEF5E8" text-anchor="start">69</text>
<rect x="1660" y="384" width="180" height="56" rx="12" fill="#22483B" stroke="#2E5A4B" stroke-width="2"/>
<text x="1750" y="418" font-family="sans-serif" font-size="16" fill="#EEF5E8" text-anchor="middle">Выбрать</text>
