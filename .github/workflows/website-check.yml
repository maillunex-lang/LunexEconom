name: Website checks
on:
  push:
    branches: [main]
    paths: ['web/**','ops/**','.github/workflows/website-check.yml']
  pull_request:
    paths: ['web/**','ops/**','.github/workflows/website-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: node --check web/app.js
      - name: Check website and deployment tests
        run: |
          python3 -m unittest discover -s ops -p 'test_*.py' -v
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'ops')
          from deploy import check_web
          check_web(Path('web'))
          print('Static web checks passed')
          PY
