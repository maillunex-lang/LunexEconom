name: Website checks
on:
  push:
    branches: [main, v2/landing]
    paths: [web/**, tools/check_website.py, tools/tests/test_website.py, .github/workflows/website-check.yml]
  pull_request:
    paths: [web/**, tools/check_website.py, tools/tests/test_website.py, .github/workflows/website-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Validate static website
        run: |
          python tools/check_website.py
          python -m unittest tools.tests.test_website -v
          node --check web/site.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser smoke and screenshots
        run: node web/tests/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-screenshots
          path: build/website-screenshots/*.png
          if-no-files-found: warn
