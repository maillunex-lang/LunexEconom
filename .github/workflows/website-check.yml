name: Website checks
on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/check_website.py', '.github/workflows/website-check.yml']
  pull_request:
    paths: ['web/**', 'tools/check_website.py', '.github/workflows/website-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static website
        run: python tools/check_website.py
