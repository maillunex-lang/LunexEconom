name: Website bundle (manual, no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify landing
        run: |
          python3 tools/check_website.py
          python3 -m unittest tools.tests.test_website -v
      - name: Assemble reproducible website package
        run: |
          mkdir -p build
          tar --sort=name --mtime="@0" --owner=0 --group=0 --numeric-owner -czf build/lunexeconom-website.tar.gz -C . web
          sha256sum build/lunexeconom-website.tar.gz | tee build/SHA256SUMS.txt
          cat build/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lunexeconom-website-bundle
          path: |
            build/lunexeconom-website.tar.gz
            build/SHA256SUMS.txt
          if-no-files-found: error
