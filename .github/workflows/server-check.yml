name: Server checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lunex_ci
          POSTGRES_PASSWORD: ci-only-no-real-secret
          POSTGRES_DB: lunex_v2_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      LUNEX_TEST_DATABASE_URL: postgresql://lunex_ci:ci-only-no-real-secret@127.0.0.1:5432/lunex_v2_ci
      LUNEX_DATABASE_URL: postgresql://lunex_ci:ci-only-no-real-secret@127.0.0.1:5432/lunex_v2_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Syntax and PostgreSQL integration
        run: |
          python -m compileall -q server ops
          python -m unittest discover -s server/tests -v
          python -m unittest discover -s ops -p 'test_*.py' -v
      - name: Waitress 100 concurrent HTTP health and login
        run: python -m server.tests.load_test
