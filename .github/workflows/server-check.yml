name: Server checks
on:
  push:
    branches: [main]
    paths: ['server/**', 'ops/**', '.github/workflows/server-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install "psycopg[binary]"
      - name: Compile and test server
        working-directory: server
        run: |
          python -m py_compile *.py
          python -m unittest test_roads test_economy test_clock test_settlement test_market test_production test_npc test_labor test_bankruptcy test_sell test_bank test_tax test_city test_election test_rating test_contracts test_owner_spend test_retail test_sqlite_util test_health_ops test_app test_auth test_stats test_postgres_stats test_geo test_ops_email test_health_deployed_sha test_postgres_migrations test_social test_exchange test_charts test_admin_api test_postgres_admin test_citygen test_postgres_citygen test_regions test_postgres_regions -v
          python -m unittest discover -s ../tools -p 'test_*.py' -v
      - name: Test admin studio (signing needs the openssl command line, present on the runner)
        run: cd admin_studio && python -m unittest discover -p 'test_*.py' -v
      - name: Test deployment scripts
        run: python -m unittest discover -s ops -p 'test_*.py' -v
