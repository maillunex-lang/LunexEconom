name: Client checks
on:
  push:
    branches: [main, v2/client-map, v2/client-enterprises, v2/client-api-base, v2/client-map-polish, v2/client-chain-screens, v2/models-lowpoly]
    paths: ['client/**', 'tools/build_strings.py', 'tools/tests/test_strings.py', '.github/workflows/client-check.yml']
  pull_request:
    paths: ['client/**', 'tools/build_strings.py', 'tools/tests/test_strings.py', '.github/workflows/client-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import and run client smoke
        run: |
          ./godot --headless --path client --editor --quit
          python3 tools/build_strings.py --check
          python3 -m unittest tools.tests.test_strings -v
          for test in api_base_smoke smoke release_smoke strings_smoke router_smoke keyboard_smoke world_generator_smoke world_roads_smoke world_stream_smoke world_interaction_smoke enterprises_smoke enterprises_map_smoke chain_screens_smoke map_polish_cache_smoke map_polish_format_smoke map_polish_road_smoke map_gesture_benchmark ui1_smoke models_load_smoke models_viewer_smoke onboarding_smoke onboarding_navigation_smoke fuel_supply_smoke chain2_smoke; do
            ./godot --headless --path client -s "tests/${test}.gd"
          done
          # pack_smoke and network_smoke require generated fixtures and arguments.
          # tools/tests/test_packs.py and test_network.py invoke them correctly.
      - name: Layout smoke and screenshots at four landscape resolutions
        run: |
          mkdir -p build/ui-screenshots
          for i in 0 1 2 3; do
            LUNEX_TEST_SIZE_INDEX="$i" LUNEX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/build/ui-screenshots" \
              xvfb-run -a ./godot --path client --rendering-driver opengl3 -s tests/scale_smoke.gd
          done
          for i in 0 1 2 3; do
            LUNEX_TEST_SIZE_INDEX="$i" LUNEX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/build/ui-screenshots" \
              xvfb-run -a ./godot --path client --rendering-driver opengl3 -s tests/map_layout_smoke.gd
          done
          for i in 0 1 2 3; do
            LUNEX_TEST_SIZE_INDEX="$i" LUNEX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/build/ui-screenshots" \
              xvfb-run -a ./godot --path client --rendering-driver opengl3 -s tests/enterprises_layout_smoke.gd
          done
          for i in 0 1 2 3; do
            LUNEX_TEST_SIZE_INDEX="$i" LUNEX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/build/ui-screenshots" \
              xvfb-run -a ./godot --path client --rendering-driver opengl3 -s tests/map_polish_layout_smoke.gd
          done
          for i in 0 1 2 3; do
            LUNEX_TEST_SIZE_INDEX="$i" LUNEX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/build/ui-screenshots" \
              xvfb-run -a ./godot --path client --rendering-driver opengl3 -s tests/chain_layout_smoke.gd
          done
          for i in 0 1 2 3; do
            LUNEX_TEST_SIZE_INDEX="$i" LUNEX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/build/ui-screenshots" \
              xvfb-run -a ./godot --path client --rendering-driver opengl3 -s tests/onboarding_layout_smoke.gd
          done
          for i in 0 1 2 3; do
            LUNEX_TEST_SIZE_INDEX="$i" LUNEX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/build/ui-screenshots" \
              xvfb-run -a ./godot --path client --rendering-driver opengl3 -s tests/chain2_layout_smoke.gd
          done
      - name: UI1 adaptive layout, text and screenshot checks
        run: |
          for i in 0 1 2 3 4; do
            LUNEX_TEST_SIZE_INDEX="$i" LUNEX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/build/ui-screenshots" \
              xvfb-run -a ./godot --path client --rendering-driver opengl3 -s tests/ui1_layout_smoke.gd
          done
      - name: Validate 64 low-poly model files and deterministic generation
        run: |
          python3 tools/models/validate_models.py
          python3 -m unittest tools.tests.test_models_pipeline -v
      - name: Model viewer adaptive layout and 10 rendered previews
        run: |
          for i in 0 1 2 3; do
            LUNEX_TEST_SIZE_INDEX="$i" LUNEX_SCREENSHOT_DIR="$GITHUB_WORKSPACE/build/ui-screenshots" \
              xvfb-run -a ./godot --path client --rendering-driver opengl3 -s tests/models_layout_smoke.gd
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-ui-screenshots
          path: build/ui-screenshots/*.png
          if-no-files-found: ignore