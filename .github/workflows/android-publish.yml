name: Publish approved Android release (no VPS writes)
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful production-key candidate workflow run"
        type: string
        required: true
      version_tag:
        description: "vMAJOR.MINOR.PATCH, must match candidate"
        type: string
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify approved candidate is for current main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          python3 -c "import sys;sys.path.insert(0,'tools');from release_version import parse;parse(sys.argv[1])" "$VERSION_TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .name)" = "Android release candidate"
          CANDIDATE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
          test "$CANDIDATE_SHA" = "$GITHUB_SHA" || { echo "Candidate must match current main HEAD"; exit 1; }
          test ! "$(gh release view "$VERSION_TAG" --json tagName --jq .tagName 2>/dev/null)" = "$VERSION_TAG"
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "signed-candidate-$VERSION_TAG-release" --dir dist
          test -s dist/build/lunex.apk
          test -s dist/build/lunex.aab
          (cd dist && sha256sum -c build/SHA256SUMS)
      - name: Reverify pinned production certificate
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner
          apksigner verify --verbose --print-certs dist/build/lunex.apk > dist/verified-certificate.txt
          python3 tools/verify_apk_cert.py dist/verified-certificate.txt ops/release_cert_sha256.txt
          python3 tools/check_apk_size.py dist/build/lunex.apk
      - name: Publish GitHub Release (manual approval required)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          gh release create "$VERSION_TAG" dist/build/lunex.apk dist/build/lunex.aab dist/build/SHA256SUMS --target "$GITHUB_SHA" --title "Башкирия: Мёд и Нефть $VERSION_TAG" --notes "Подписанный релиз Android. Развёртывание на VPS и публикация подписанных манифестов выполняются отдельно владельцем."
          echo "No VPS deployment is performed by GitHub Actions."
