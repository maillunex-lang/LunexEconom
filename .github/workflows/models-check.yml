name: Models check
on:
  push:
    paths:
      - 'client/world3d/models/**'
      - 'tools/**'
      - '.github/workflows/models-check.yml'
  pull_request:
    paths:
      - 'client/world3d/models/**'
      - 'tools/**'
      - '.github/workflows/models-check.yml'
jobs:
  glb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: cd tools && python -m unittest -v test_validate_models
      - name: Validate checked-in GLB
        run: python tools/validate_models.py client/world3d/models
