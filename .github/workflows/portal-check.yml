name: Portal checks
on:
  push:
    branches: [main]
    paths: ['portal/**', 'tools/work_plan.py', 'tools/tests/test_work_plan.py', 'docs/work_plan.json', '.github/workflows/portal-check.yml']
  pull_request:
    paths: ['portal/**', 'tools/work_plan.py', 'tools/tests/test_work_plan.py', 'docs/work_plan.json', '.github/workflows/portal-check.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest portal.tests.test_portal tools.tests.test_work_plan -v
