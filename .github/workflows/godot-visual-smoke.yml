name: Godot 4.7 visual smoke (isolated)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/godot-visual-smoke.yml'
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install display and Godot 4.7.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libx11-6
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import GLB under Xvfb
        run: |
          set -o pipefail
          timeout 120 xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path client --editor --quit 2>&1 | tee godot-import.log
          ! grep -E 'ERROR:|Parse Error:' godot-import.log
      - name: Capture isolated GLB screenshot
        run: |
          set -o pipefail
          mkdir -p qa-artifacts
          LUNEX_QA_SCREENSHOT="$PWD/qa-artifacts/factory.png" timeout 90 xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path client --script res://qa/capture_model.gd 2>&1 | tee godot-render.log
          test -s qa-artifacts/factory.png
          ! grep -E 'ERROR:|Parse Error:' godot-render.log
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-render-screenshot
          path: |
            qa-artifacts/factory.png
            godot-render.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-import-log
          path: godot-import.log